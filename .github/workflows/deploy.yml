name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Serialize deploys to main; a newer push supersedes the queued one.
concurrency:
  group: deploy-main
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write # Workload Identity Federation

env:
  IMAGE: ${{ vars.AR_HOST }}/${{ vars.GCP_PROJECT_ID }}/${{ vars.AR_REPO }}/${{ vars.CLOUDRUN_SERVICE }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race ./...

  build-push:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Auth to GCP (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ vars.AR_HOST }}
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:sha-${{ github.sha }}
            ${{ env.IMAGE }}:latest

  deploy:
    runs-on: ubuntu-latest
    needs: [test, build-push]
    steps:
      - name: Auth to GCP (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ vars.CLOUDRUN_SERVICE }}
          region: ${{ vars.GCP_REGION }}
          image: ${{ env.IMAGE }}:sha-${{ github.sha }}
          flags: '--service-account=${{ secrets.RUNTIME_SERVICE_ACCOUNT }}'
          env_vars: |
            GOOGLE_CALENDAR_ID=${{ secrets.GOOGLE_CALENDAR_ID }}
            MSTEAM_WEBHOOK_URL=${{ secrets.MSTEAM_WEBHOOK_URL }}
            CALENDAR_TIMEZONE=${{ vars.CALENDAR_TIMEZONE }}
            LOG_LEVEL=${{ vars.LOG_LEVEL }}
      - name: Smoke test
        run: |
          # Service may be IAM-gated (403) — any HTTP response proves it's up.
          for i in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 "${{ steps.deploy.outputs.url }}/ping" || true)
            if [ "$code" != "000" ] && [ -n "$code" ]; then
              echo "service is up (http $code)"; exit 0
            fi
            sleep 3
          done
          echo "service did not respond to /ping" && exit 1